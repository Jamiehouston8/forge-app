workflows:
  ios-workflow:
    name: Forge iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Forge
    environment:
      groups:
        - certificate_credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.forgesfit.app"
        APP_STORE_APPLE_ID: "6815235701"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync the web app into the iOS project
        script: npx cap sync ios
      - name: Set up keychain to be used for codesigning
        script: keychain initialize
      - name: Fetch signing files
        script: |
          # CERTIFICATE_PRIVATE_KEY is stored base64-encoded (single line) so
          # pasting it into Codemagic's UI can't mangle its line breaks.
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 -D > "$CM_BUILD_DIR/certificate_private_key.pem"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$CM_BUILD_DIR/certificate_private_key.pem" \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          # TestFlight uploads don't count as App Store builds, so check both and
          # take the higher. Each falls back to 0 when there's nothing there yet.
          TESTFLIGHT_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          APP_STORE_BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          LATEST_BUILD_NUMBER=$(( TESTFLIGHT_BUILD > APP_STORE_BUILD ? TESTFLIGHT_BUILD : APP_STORE_BUILD ))
          echo "Latest TestFlight build: $TESTFLIGHT_BUILD, App Store build: $APP_STORE_BUILD -> using $(($LATEST_BUILD_NUMBER + 1))"
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
