<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Forge Gym — dev harness</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../www/gym/gym.css"/>
<style>
  body { margin: 0; background: #0a0a0a; }
  #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #fff; color: #000; font: 600 14px Inter, sans-serif; padding: 10px 16px; border-radius: 999px; z-index: 9999; transition: transform 0.25s; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<!-- Dev harness for the gym section. The real code lives in www/gym/ and is
     what Forge itself loads; this page just mounts it with localStorage.
     Serve from the forge-app root:  python -m http.server 8790
     then open http://127.0.0.1:8790/prototypes/gym/  (#demo,body etc. works) -->
<div id="gym-root" class="fg-root"></div>
<div id="toast"></div>
<script src="../../www/gym/exercises.js"></script>
<script src="../../www/gym/bodymap.js"></script>
<script src="../../www/gym/gym.js"></script>
<script>
  const KEY = 'forge_gym_v1';
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }
  ForgeGym.mount(document.getElementById('gym-root'), {
    get: () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
    put: d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} },
    toast,
    dev: true,
  });
  // #demo loads demo data (via the settings sheet's button); #body etc. opens a tab.
  const parts = location.hash.slice(1).split(',');
  const click = sel => { const b = document.querySelector(sel); if (b) b.click(); };
  if (parts.includes('demo') && !(JSON.parse(localStorage.getItem(KEY) || 'null') || {}).workouts?.length) {
    click('[data-act="settings"]'); click('[data-act="demo"]');
  }
  const tab = parts.find(p => ['train', 'body', 'ranks', 'recovery', 'history'].includes(p));
  if (tab) click(`[data-tab="${tab}"]`);
</script>
</body>
</html>
